services:
  postgres:
    image: postgres:16-alpine
    container_name: disha_core-postgres-1
    environment:
      POSTGRES_DB: disha
      POSTGRES_USER: disha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password_here}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - disha_core_postgres_data:/var/lib/postgresql/data
      - ./disha_core/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disha -d disha"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - disha_internal
    restart: unless-stopped

  backend:
    build:
      context: ./disha_core
    container_name: disha_core-backend-1
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: disha
      DB_USER: disha
      DB_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password_here}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_HEALTH_DATA_AUTHORIZED: "true"
      GROQ_USAGE_CHARGES_AUTHORIZED: "true"
      GROQ_HEALTH_DATA_PROCESSING_APPROVED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_HEALTH_DATA_AUTHORIZED: "true"
      GEMINI_PAID_OR_CONTRACTED: "true"
      EDGE_TTS_HEALTH_DATA_PROCESSING_APPROVED: "true"
      ALLOW_CLASSIFIER_FALLBACK: "true"
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./disha_core:/srv/disha_core
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - disha_internal
    restart: unless-stopped

  proxy:
    image: nginx:1.28-alpine
    container_name: disha_core-proxy-1
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./disha_core/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - disha_internal
    restart: unless-stopped

volumes:
  disha_core_postgres_data: {}

networks:
  disha_internal: {}

