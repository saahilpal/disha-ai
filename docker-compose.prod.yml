# ==============================================================================
# DISHA AI — PRODUCTION MULTI-SERVICE ARCHITECTURE
# Designed for Cloud Linux VMs (4+ vCPU, 8+ GB RAM)
# Runs: PostgreSQL 16 (pg_trgm) + Laya Zero-Shot Classifier + FastAPI Voice Engine + NGINX/Caddy
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: disha-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: disha
      POSTGRES_USER: disha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disha_secure_pass_123}
    volumes:
      - disha_core_postgres_data:/var/lib/postgresql/data
      - ./disha_core/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./disha_core/db/seed_icmr_data.sql:/docker-entrypoint-initdb.d/002-icmr.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disha -d disha"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - disha_network

  laya:
    image: python:3.12-slim
    container_name: disha-prod-laya
    restart: unless-stopped
    environment:
      LAYA_HOST: "0.0.0.0"
      LAYA_PORT: "8005"
      LAYA_MODELS: "multilingual"
      LAYA_DEFAULT_MODEL: "multilingual"
      LAYA_PRELOAD: "1"
    command: >
      sh -c "pip install --no-cache-dir laya==0.4.27 && python -m laya.serve"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8005/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - disha_network

  backend:
    build:
      context: ./disha_core
    container_name: disha-prod-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: disha
      DB_USER: disha
      DB_PASSWORD: ${POSTGRES_PASSWORD:-disha_secure_pass_123}
      LAYA_URL: "http://laya:8005"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      laya:
        condition: service_healthy
    volumes:
      - ./data:/srv/data:ro
    networks:
      - disha_network

  proxy:
    image: nginx:1.28-alpine
    container_name: disha-prod-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./disha_core/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - disha_network

volumes:
  disha_core_postgres_data:
    driver: local

networks:
  disha_network:
    driver: bridge

