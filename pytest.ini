[pytest]
pythonpath = .
asyncio_default_fixture_loop_scope = function
testpaths =
    tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::starlette.testclient.StarletteDeprecationWarning
markers =
    asyncio: mark test as async test
    live_network: mark test as requiring live network access
    manual: mark test as manual verification
