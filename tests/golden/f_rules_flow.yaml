version: "1.0.0"
spec: "Behavior Spec v1"
category: "conversation_flow"
description: "Golden test cases for Rules F1 to F5 covering Zero-echo, At Most One Question, 1-3 Sentences WhatsApp Brevity, Selective Empathy, and Forward Motion."

cases:
  # -------------------------------------------------------------
  # F1: Zero-echo - never repeat back user-stated facts
  # -------------------------------------------------------------
  - id: "GOLDEN-F1-001"
    rule_id: "F1"
    name: "Rejection of echoing user-stated weight"
    category: "conversation_flow"
    language: "hinglish"
    description: "Parroting back stated weight violates zero-echo invariant."
    candidate_response: "Aapka weight 62kg hai toh chaliye diet plan banate hain. Kya aap regular meals lete hain?"
    expected_valid: false
    expected_violations:
      - "f1_zero_echo"
    context:
      user_input: "Mera weight 62kg hai aur mujhe weight maintain karna hai"

  - id: "GOLDEN-F1-002"
    rule_id: "F1"
    name: "Rejection of echoing user-stated age in English"
    category: "conversation_flow"
    language: "english"
    description: "Repeating user's stated age back to them violates zero-echo."
    candidate_response: "Your age 28 years means your metabolism is quite active. What are your main goals?"
    expected_valid: false
    expected_violations:
      - "f1_zero_echo"
    context:
      user_input: "I am 28 years old and want to stay fit"

  - id: "GOLDEN-F1-003"
    rule_id: "F1"
    name: "Rejection of echo clause prefix (Aapne bataya ki...)"
    category: "conversation_flow"
    language: "hinglish"
    description: "Opening turn with 'Aapne bataya ki...' echoes user's input needlessly."
    candidate_response: "Aapne bataya ki subah acidity hoti hai, toh garam paani piyein. Kya aap chai peete hain?"
    expected_valid: false
    expected_violations:
      - "f1_zero_echo_prefix"
    context:
      user_input: "Mujhe subah acidity hoti hai"

  - id: "GOLDEN-F1-004"
    rule_id: "F1"
    name: "Rejection of echo clause prefix (As you mentioned that...)"
    category: "conversation_flow"
    language: "english"
    description: "Opening turn with 'As you mentioned that...' violates zero-echo."
    candidate_response: "As you mentioned that you sleep poorly, let us check your schedule. What time do you turn off your screens?"
    expected_valid: false
    expected_violations:
      - "f1_zero_echo_prefix"
    context:
      user_input: "I sleep poorly every night"

  - id: "GOLDEN-F1-005"
    rule_id: "F1"
    name: "Valid zero-echo natural acknowledgement"
    category: "conversation_flow"
    language: "hinglish"
    description: "Natural forward-moving acknowledgement without echoing numbers or repeating sentences."
    candidate_response: "Samajh gayi, chaliye routine par dhyan dete hain. Kya aap daily breakfast time par kar pate hain?"
    expected_valid: true
    expected_violations: []
    context:
      user_input: "Mera weight 74kg hai aur 6 ghante sota hoon"

  # -------------------------------------------------------------
  # F2: At most ONE question per response
  # -------------------------------------------------------------
  - id: "GOLDEN-F2-001"
    rule_id: "F2"
    name: "Rejection of multiple questions in single response"
    category: "conversation_flow"
    language: "hinglish"
    description: "Asking two questions overwhelms the user and violates F2."
    candidate_response: "Aap kab uthte hain? Aur raat ko kitne baje sote hain?"
    expected_valid: false
    expected_violations:
      - "f2_multiple_questions"
    context:
      user_input: "Mera sleep schedule theek nahi hai"

  - id: "GOLDEN-F2-002"
    rule_id: "F2"
    name: "Rejection of three questions in English"
    category: "conversation_flow"
    language: "english"
    description: "Multiple question marks in single response violates F2."
    candidate_response: "What time do you wake up? How much water do you drink? Do you exercise regularly?"
    expected_valid: false
    expected_violations:
      - "f2_multiple_questions"
    context:
      user_input: "I want a health plan"

  - id: "GOLDEN-F2-003"
    rule_id: "F2"
    name: "Valid single question response"
    category: "conversation_flow"
    language: "hinglish"
    description: "Single question focused on the priority clinical slot."
    candidate_response: "Khana khane ke baad thoda tahalna faydemand hota hai. Kya aapko raat me bhari lagta hai?"
    expected_valid: true
    expected_violations: []
    context:
      user_input: "Khane ke baad indigestion lagti hai"

  - id: "GOLDEN-F2-004"
    rule_id: "F2"
    name: "Valid zero question response (pure statement or pivot)"
    category: "conversation_flow"
    language: "hinglish"
    description: "Response with zero questions is completely valid under at-most-one question rule."
    candidate_response: "Yeh clinical sawal ek specialist behtar samajh sakte hain. Aap hamare expert ke saath 10-minute ki call book kar sakte hain."
    expected_valid: true
    expected_violations: []
    context:
      user_input: "Doctor se kab miloon?"

  # -------------------------------------------------------------
  # F3: 1-3 sentences maximum; no repetitive boilerplate empathy
  # -------------------------------------------------------------
  - id: "GOLDEN-F3-001"
    rule_id: "F3"
    name: "Valid 3-sentence response with punctuation variety"
    category: "conversation_flow"
    language: "hinglish"
    description: "Exactly three well-crafted sentences ending with period, exclamation, and question mark."
    candidate_response: "Main samajh sakti hoon, dard me aaram zaroori hai. Thoda gunguna paani piyein! Kya aapne koi gharelu nuskha try kiya hai?"
    expected_valid: true
    expected_violations: []
    context:
      distress_expressed: true
      user_input: "Pet me bohot tej dard hai"

  # -------------------------------------------------------------
  # F4: Selective empathy - only when user shares distress/struggle
  # -------------------------------------------------------------
  - id: "GOLDEN-F4-001"
    rule_id: "F4"
    name: "Rejection of boilerplate empathy when distress is absent"
    category: "conversation_flow"
    language: "hinglish"
    description: "User is asking simple factual question; dramatic empathy boilerplate must be rejected."
    candidate_response: "Main aapka dard samajh sakti hoon. Diet me fiber badhayein."
    expected_valid: false
    expected_violations:
      - "f4_unprompted_boilerplate_empathy"
    context:
      distress_expressed: false
      user_input: "Diet me fiber kaise badhaun?"

  - id: "GOLDEN-F4-002"
    rule_id: "F4"
    name: "Rejection of canned empathy in English without distress"
    category: "conversation_flow"
    language: "english"
    description: "Canned 'I deeply understand your pain' without distress expression is rejected."
    candidate_response: "I deeply understand your pain. Let us plan your weekly workout."
    expected_valid: false
    expected_violations:
      - "f4_unprompted_boilerplate_empathy"
    context:
      distress_expressed: false
      user_input: "What workouts should I do on Monday?"

  - id: "GOLDEN-F4-003"
    rule_id: "F4"
    name: "Valid empathy permitted when user explicitly expresses distress"
    category: "conversation_flow"
    language: "hinglish"
    description: "Empathy is allowed and appropriate when user shares struggle or physical pain."
    candidate_response: "Main samajh sakti hoon, thoda aaram karein. Kya yeh dard pichle hafte se zyada badh gaya hai?"
    expected_valid: true
    expected_violations: []
    context:
      distress_expressed: true
      user_input: "Mai roz dard me rehti hoon, bohot pareshan ho chuki hoon"

  # -------------------------------------------------------------
  # F5: Forward motion toward clinical evaluation goal
  # -------------------------------------------------------------
  - id: "GOLDEN-F5-001"
    rule_id: "F5"
    name: "Forward motion from greeting to clinical concern"
    category: "conversation_flow"
    language: "hinglish"
    description: "Acknowledges greeting and moves directly toward health focus without stalling."
    candidate_response: "Hello! Main Disha hoon, aapki health coach. Aaj aap kis cheez par baat karna chahenge?"
    expected_valid: true
    expected_violations: []
    context:
      user_input: "Hello"

