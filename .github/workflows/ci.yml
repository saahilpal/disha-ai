name: Disha AI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: disha
          POSTGRES_PASSWORD: disha_secure_pass_123
          POSTGRES_DB: disha
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r disha_core/requirements.txt pytest pytest-asyncio pytest-subtests

      - name: Initialize database
        env:
          PGPASSWORD: disha_secure_pass_123
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U disha -d disha -f disha_core/db/schema.sql
          psql -h localhost -U disha -d disha -f disha_core/db/seed_product_facts.sql
          psql -h localhost -U disha -d disha -f disha_core/db/seed_knowledge_chunks.sql
          psql -h localhost -U disha -d disha -f disha_core/db/seed_unified_exercise_rag.sql
          psql -h localhost -U disha -d disha -f disha_core/db/seed_official_exercise_guidelines.sql
          psql -h localhost -U disha -d disha -f disha_core/db/seed_icmr_data.sql
          uv run python -m disha_core.db.apply_conversations_schema
          uv run python -m disha_core.db.apply_journey_schema
          uv run python -m disha_core.db.apply_pep_habits_schema

      - name: Start backend
        env:
          DATABASE_URL: postgresql://disha:disha_secure_pass_123@127.0.0.1:5432/disha
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: disha
          DB_PASSWORD: disha_secure_pass_123
          DB_NAME: disha
          GROQ_API_KEY: dummy_token_scrubbed
          GEMINI_API_KEY: dummy_token_scrubbed
        run: |
          uv run uvicorn disha_core.main:app --host 127.0.0.1 --port 8080 > /tmp/disha-backend.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: disha
          DB_PASSWORD: disha_secure_pass_123
          DB_NAME: disha
          DATABASE_URL: postgresql://disha:disha_secure_pass_123@127.0.0.1:5432/disha
          GROQ_API_KEY: dummy_token_scrubbed
          GEMINI_API_KEY: dummy_token_scrubbed
          MAX_SCENARIO_LATENCY_MS: "1500"
        run: uv run pytest -v tests/ -k 'not manual and not live_network'
