services:
  - type: web
    name: disha-ai-health-coach
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TTS_VOICE
        value: en-IN-NeerjaNeural
      - key: DB_PATH
        value: /data/disha.db
    disk:
      name: disha-db-storage
      mountPath: /data
      sizeGB: 1

