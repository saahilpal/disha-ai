services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: disha
      POSTGRES_USER: disha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/seed_product_facts.sql:/docker-entrypoint-initdb.d/002-product-facts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disha -d disha"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [disha_internal]
    restart: unless-stopped

  api:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: disha
      DB_USER: disha
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell environment}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_HEALTH_DATA_AUTHORIZED: ${GROQ_HEALTH_DATA_AUTHORIZED:-false}
      GROQ_USAGE_CHARGES_AUTHORIZED: ${GROQ_USAGE_CHARGES_AUTHORIZED:-false}
      GROQ_HEALTH_DATA_PROCESSING_APPROVED: ${GROQ_HEALTH_DATA_PROCESSING_APPROVED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_HEALTH_DATA_AUTHORIZED: ${GEMINI_HEALTH_DATA_AUTHORIZED:-false}
      GEMINI_PAID_OR_CONTRACTED: ${GEMINI_PAID_OR_CONTRACTED:-false}
      EDGE_TTS_HEALTH_DATA_PROCESSING_APPROVED: ${EDGE_TTS_HEALTH_DATA_PROCESSING_APPROVED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [disha_internal, api_egress]
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [disha_internal]
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  disha_internal: {}
  api_egress: {}
