version: 1.0.0
metadata:
  table_name: clinician_emergency_red_flags
  owner: Chief Medical Officer / Clinical Safety Committee
  last_reviewed: '2026-11-09'
  description: Clinician-owned emergency red flag and crisis lexicon, negation rules,
    and response protocols per DPDP Act Section 8 and Telemedicine Practice Guidelines
  compliance:
  - DPDP Act 2023 Section 8 (Security Safeguards & Emergency Interception)
  - Telemedicine Practice Guidelines 2020 (Mandatory Acute Triage Protocol)
  - Mental Healthcare Act 2017 (Tele-MANAS Crisis Escalation 14416)
  default_protocol_text: Yeh emergency ho sakti hai. Abhi 112 par call karein ya kisi
    paas ke vyakti se call karne ko kahein.
exceptions:
- id: EXC_BLACKOUT_CURTAIN
  phrase: blackout
  pattern: \bblackout\s+(?:curtains?|shades?|blinds?|drapes?|window)\b
  category: NEUROLOGICAL
  description: Benign home decor context
- id: EXC_CHEST_PAINTING
  phrase: chest
  pattern: \bchest\s+paint(?:ing|ings)?\b
  category: CARDIOVASCULAR
  description: Artistic painting or hobby
- id: EXC_HEART_PILLOW
  phrase: heart
  pattern: \bheart-?shaped\s+pillow\b
  category: CARDIOVASCULAR
  description: Heart shaped object or pillow
categories:
  CARDIOVASCULAR:
    severity: CRITICAL
    protocol_text: Yeh emergency ho sakti hai. Abhi 112 par call karein ya kisi paas
      ke vyakti se call karne ko kahein.
    languages:
    - en
    - hi
    - hinglish
    scripts:
    - Latn
    - Deva
    terms:
      en:
      - chest pain
      - chest pressure
      - heart attack
      - severe chest pain
      - myocardial infarction
      - acute coronary syndrome
      - angina pectoris
      - cardiac arrest
      - crushing chest pain
      - acute chest pain
      - left hand pain
      - left arm pain
      - chest tightness
      - chest discomfort
      - heart stopped
      - heart stopped beating
      - no pulse
      - pulseless
      - tearing chest pain
      hinglish:
      - chhati mein dard
      - chhati me dard
      - chhati mein dabaav
      - chhati mein dabav
      - seene mein dard
      - seene me dard
      - seene mein dabaav
      - seene mein dabav
      - seene mein bhaari dabav
      - seene mein bhari dabav
      - dil ka daura
      - dil ka daura pada
      - dil me dard
      - dil mein dard
      - chaati mein dard
      - chaati me dard
      - chaati me dabav
      - chaati mein dabav
      - dhadkan ruk
      - dhadkan band
      - dil ki dhadkan ruk
      - dil ki dhadkan band
      - pulse nahi mil rahi
      hi:
      - छाती में दर्द
      - सीने में दर्द
      - दिल का दौरा
      - दिल में दर्द
      - छाती में दबाव
      - सीने में दबाव
      - हार्ट अटैक
      - दिल की धड़कन बंद
      - धड़कन रुक गई
      - नब्ज नहीं चल रही
      - पल्स नहीं
      - छाती में असहनीय दर्द
      - सीने में बहुत तेज दर्द
    regex_patterns:
    - name: spaced chest pain
      pattern: (?<!\w)c\s*h\s*h\s*a\s*t\s*i.{0,12}(?:d\s*a\s*r\s*d|d\s*a\s*b\s*a\s*v)(?!\w)
    - name: cardio regex
      pattern: \b(?:chhati|chaati|seene|chest|chst|dil|myocardial|angina|heart)\b.{0,35}?\b(?:dard|drd|daba+v|pressure|pain|attack|crushing|crushng|tightness|daura|infarction|pectoris|arrest|stopped)\b|\bcrush(?:ing|ng)\s+ch[e]?st\s+pain\b|\bleft\s+(?:hand|arm)\s+pain\b|\b(?:no|lost)\s+pulse\b|\bpulseless\b|(?:छाती|सीने|दिल|धड़कन).{0,35}?(?:दर्द|दबाव|दौरा|बंद|रुक)
    negation_patterns:
    - (?:do\s+not|don't|no)\s+(?:have|feel)\s+(?:any\s+)?(?:chest\s+pain|chest\s+pressure|heart\s+attack)
    - chhati\s+m(?:ein)?\s+koi\s+d(?:a)?rd\s+n(?:a)?hi
    - seene\s+m(?:ein|e)?\s+bilkul\s+dard\s+nahi
    - dil\s+ka\s+daura\s+nahi\s+pada
    - (?:छाती|सीने)\s+में\s+(?:कोई\s+)?दर्द\s+नहीं
