      - respiratory failure
      - severe shortness of breath
      - shortness of breath
      - gasping for air
      - choking
      - suffocating
      - asthma attack
      - oxygen level
      - throat is closing
      - throat closing
      - unable to breathe
      - stopped breathing
      - lips turning blue
      - cyanosis
      - stridor
      - severe anaphylaxis
      - anaphylaxis
      - anaphylactic shock
      hinglish:
      - saans nahi aa rahi
      - saans ruk rahi
      - saans lene mein dikkat
      - saas lene mein takleef
      - saas lene me taklif
      - saas lene mein taklif
      - saans phool rahi
      - saas phool rahi
      - dum ghut raha
      - hoth neele
      - saans bilkul atak
      - saans atak rahi
      - saas lene me bahut takleef
      - gale me khana atak
      - gala band ho raha
      - saans band ho rahi
      hi:
      - सांस नहीं आ रही
      - सांस रुक रही
      - सांस लेने में दिक्कत
      - सांस लेने में तकलीफ
      - सांस फूल रही
      - दम घुट रहा
      - सांस बंद
      - सांस पूरी तरह रुक गई
      - ऑक्सीजन लेवल बहुत तेजी से गिर
      - गले में खाना अटक
      - सांस बंद हो रही है
    regex_patterns:
    - name: spaced breathing distress
      pattern: (?<!\w)s\s*a\s*a\s*n\s*s.{0,16}(?:n\s*a\s*h\s*i|r\s*u\s*k)(?!\w)
    - name: respiratory regex
      pattern: \b(?:saans|saas|sans|breath(?:e|ing)?|dum|respiratory)\b.{0,35}?\b(?:nahi|ni|takleef|taklif|dikkat|ruk|choking|choke|gasping|cannot|can't|cant|phool|ghut|distress|failure|atak)\b|\basthma\s+attack\b|\bsuffocating\b|\b(?:throat\s+is\s+closing|throat\s+closing|anaphylaxis|stridor|lips\s+turning\s+blue)\b|\b(?:oxygen|spo2)\b.{0,25}?\b(?:drop|gir|fall|low|kam)\b|सांस.{0,25}?(?:नहीं|रुक|फूल|दिक्कत|तकलीफ|बंद|अटक)|ऑक्सीजन.{0,20}?गिर
    negation_patterns:
    - (?:do\s+not|don't|no)\s+(?:have|feel)\s+(?:any\s+)?(?:difficulty\s+breathing|shortness\s+of\s+breath)
    - not\s+having\s+any\s+breathing\s+trouble
    - saans\s+lene\s+m(?:ein)?\s+koi\s+dikkat\s+n(?:a)?hi
    - saans\s+phool\s+nahi\s+rahi
    - सांस\s+लेने\s+में\s+(?:कोई\s+)?(?:तकलीफ|दिक्कत)\s+नहीं
  NEUROLOGICAL:
    severity: CRITICAL
    protocol_text: Yeh emergency ho sakti hai. Abhi 112 par call karein ya kisi paas
