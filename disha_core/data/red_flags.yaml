  CRISIS:
    severity: EMERGENCY_CRISIS
    protocol_text: Agar aap turant khatre mein hain, 112 par call karein ya kisi bharosemand
      vyakti ke paas jaayen. Tele-MANAS se 14416 par bhi baat kar sakte hain.
    languages:
    - en
    - hi
    - hinglish
    scripts:
    - Latn
    - Deva
    terms:
      en:
      - suicide
      - kill myself
      - end my life
      - self harm
      - want to die
      - poison
      - overdose
      - sleeping pills
      - hang myself
      - hanging myself
      - cutting my wrists
      - cut my wrists
      - rat poison
      - toilet cleaner acid
      - pesticide
      hinglish:
      - khudkushi
      - jaan dena chahta
      - apne aap ko maar
      - zeher kha liya
      - zeher
      - apni jaan
      - nasein kaat
      - faansi
      - faasi
      - neend ki goliyan
      - neend ki sari goliyan
      - neend ki 50 goliyan
      - keede maarne wali dawa
      - building se kood
      hi:
      - आत्महत्या
      - खुदकुशी
      - जान देना चाहता
      - अपने आप को मार
      - ज़हर
      - जहर
      - फांसी
      - नींद की सारी गोलियां
      - नींद की गोलियां
      - कीटनाशक ज़हर
      - हाथ की नस काट
      - फांसी लगाने
    regex_patterns:
    - name: crisis regex
      pattern: \bsuicide\b|\bkill\s+myself\b|\bend\s+my\s+life\b|\bself\s+harm\b|\bwant\s+to\s+die\b|\bkhudkushi\b|\bjaan\s+(?:dena|lena)\b|\bzeher\b|\bpoison\b|\bfaansi\b|\bfaasi\b|\b(?:overdose|sleeping\s+pills?|pesticide|rat\s+poison|cut(?:ting)?\s+(?:my\s+)?wrists?|hang(?:ing)?\s+myself)\b|\bneend\s+ki\s+.*goli|\b(?:tezaab|acid)\b.{0,20}?\b(?:pi|drank|pee)\b|आत्महत्या|खुदकुशी|ज़हर|फांसी|नींद\s+की.*गोली
