      - bahut khoon beh
      - tez khoon beh
      - bada accident
      - gehri chot
      - khoon ki ulti
      - khoon nikal
      - goli lag
      - chaku lag
      - car accident
      - chaku lag gaya
      - goli lag gayi
      - sar toot gaya
