      pattern: \b(?:chehra|chhra|face)\b.{0,30}?\b(?:tedha|droop|droping|latak)\b|\bslurred\s+(?:speech|spch)\b|\bparalyz(?:ed|is)\b|\bbol\s+nahi\s+pa\b|\bbehosh\b|\bunconscious\b|\bstroke\b|\blakwa\b|\bmirgi\b|\b(?:seizure|convuls(?:ing|ion)|epilep|status\s+epilepticus)\b|\bthunderclap(?:\s+headache)?\b|\bworst\s+headache\b|\bunresponsive\b|\bpassed\s+out\b|चेहरा.{0,20}?टेढ़ा|लकवा|बेहोश|अचेत|मिर्गी|जीवन\s+का\s+सबसे\s+(?:भयंकर|तेज|खराब)\s+सिरदर्द
