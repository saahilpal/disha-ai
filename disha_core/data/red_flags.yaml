    - आत्महत्या\s+का\s+कोई\s+विचार\s+नहीं
  TRAUMA:
    severity: CRITICAL
    protocol_text: Yeh emergency ho sakti hai. Abhi 112 par call karein aur paas ke
      kisi vyakti se madad lein.
    languages:
    - en
    - hi
    - hinglish
    scripts:
    - Latn
    - Deva
    terms:
      en:
      - uncontrolled bleeding
      - heavy bleeding
      - severe burn
      - internal bleeding
      - abdominal hemorrhage
      - acute abdominal hemorrhage
      - abdominal haemorrhage
      - acute hemorrhage
      - massive bleeding
      - arterial bleeding
      - shock
